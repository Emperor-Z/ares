[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ares"
version = "0.3.0"
description = "Local multi-agent AI system: orchestrator, coder, thinker, runner and Serena agents on Ollama"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
authors = [{ name = "Arjun Ashad" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
memory = ["mem0ai>=2.2,<3", "ollama>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
ares = "ares.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ares"]

[tool.pytest.ini_options]
testpaths = ["tests"]
